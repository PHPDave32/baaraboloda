services:
  app:
    environment:
      SPRING_PROFILES_ACTIVE: prod,postgresql
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-baaraboloda}
      DATABASE_USER: ${DATABASE_USER:?Renseigner DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Renseigner DATABASE_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-baaraboloda}
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-baaraboloda}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Renseigner POSTGRES_ADMIN_PASSWORD}
      APP_DB_USER: ${DATABASE_USER:?Renseigner DATABASE_USER}
      APP_DB_PASSWORD: ${DATABASE_PASSWORD:?Renseigner DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-app-user.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 15
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
volumes:
  postgres_data:
