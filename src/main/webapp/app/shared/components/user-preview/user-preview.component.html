<div class="preview-anchor" (mouseenter)="!externalHover && open(trigger)" (mouseleave)="!externalHover && close()" (focusout)="close()">
  <button
    #trigger
    type="button"
    class="preview-trigger"
    (focus)="open(trigger)"
    (click)="open(trigger)"
    [attr.aria-expanded]="opened()"
    [attr.aria-label]="'Aperçu de ' + (user.firstName || user.login)"
  >
    <ng-content />
  </button>
  <section #card popover="manual" class="user-preview" role="tooltip" [style.left.px]="left()" [style.top.px]="top()">
    <div class="preview-cover">
      <span class="cover-orbit orbit-one"></span><span class="cover-orbit orbit-two"></span
      ><span class="preview-caption">LES TALENTS DE VOTRE ÉQUIPE</span>
    </div>
    <div class="preview-content">
      <div class="preview-portrait"><app-avatar [user]="user" size="lg" /></div>
      <span class="account-state" [class.inactive]="!user.activated"><i></i>{{ user.activated ? 'Compte actif' : 'Compte inactif' }}</span>
      <h3>{{ user.firstName }} {{ user.lastName }}</h3>
      <p class="preview-profile">{{ profile || 'Membre de l’équipe' }}</p>
      <div class="preview-details">
        <div>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
            <rect x="3" y="5" width="18" height="14" rx="3" />
            <path d="m3 6 9 7 9-7" /></svg
          ><span>{{ user.email || 'Email non renseigné' }}</span>
        </div>
        <div>
          <span class="at-symbol">&#64;</span><span>{{ user.login }}</span>
        </div>
      </div>
      <div class="preview-footer"><span class="footer-mark">✦</span> Un profil, des talents, une équipe.</div>
    </div>
  </section>
</div>
