@if (pageCount > 1) {
  <div class="flex items-center justify-center gap-2">
    <button
      type="button"
      (click)="go(page - 1)"
      [disabled]="page === 1"
      class="grid h-8 w-8 place-items-center rounded-lg border border-slate-200 bg-white text-slate-600 transition hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-40"
      aria-label="Page précédente"
    >
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
      </svg>
    </button>
    <span class="text-xs text-slate-500">Page {{ page }} / {{ pageCount }}</span>
    <button
      type="button"
      (click)="go(page + 1)"
      [disabled]="page === pageCount"
      class="grid h-8 w-8 place-items-center rounded-lg border border-slate-200 bg-white text-slate-600 transition hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-40"
      aria-label="Page suivante"
    >
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
      </svg>
    </button>
  </div>
}
