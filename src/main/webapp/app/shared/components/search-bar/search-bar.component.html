<div class="relative w-full max-w-xs">
  <span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-slate-400">
    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z" />
    </svg>
  </span>
  <input
    type="text"
    [ngModel]="value"
    (ngModelChange)="onInput($event)"
    [placeholder]="placeholder"
    class="w-full rounded-xl border border-slate-300 bg-white py-2 pl-9 pr-9 text-xs text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-[#328cb1] focus:ring-2 focus:ring-[#328cb1]/20"
  />
  @if (value) {
    <button
      type="button"
      (click)="clear()"
      class="absolute inset-y-0 right-2 flex items-center text-slate-400 transition hover:text-slate-600"
      aria-label="Effacer la recherche"
    >
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  }
</div>
