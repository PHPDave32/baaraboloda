<div class="toast-stack" aria-live="polite" aria-atomic="true">
  @for (toast of toasts(); track toast.id) {
    <div
      class="toast-item"
      [class.toast-success]="toast.type === 'success'"
      [class.toast-error]="toast.type === 'error'"
      [class.toast-info]="toast.type === 'info'"
      [class.toast-warning]="toast.type === 'warning'"
      role="alert"
      [class.toast-leaving]="isLeaving(toast.id)"
      (mouseenter)="onMouseEnter(toast)"
      (mouseleave)="onMouseLeave(toast)"
    >
      <div class="toast-icon">
        @switch (toast.type) {
          @case ('success') {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
          }
          @case ('error') {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          }
          @case ('warning') {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"
              />
            </svg>
          }
          @default {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          }
        }
      </div>

      <div class="toast-body">
        @if (toast.title) {
          <p class="toast-title">{{ toast.title }}</p>
        }
        <p class="toast-message">{{ toast.message }}</p>
      </div>

      @if (toast.closeButton) {
        <button type="button" class="toast-close" (click)="close(toast.id)" aria-label="Fermer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      }

      @if (toast.progressBar && toast.duration > 0) {
        <div class="toast-progress">
          <span class="toast-progress-bar" [style.animation-duration.ms]="toast.duration"></span>
        </div>
      }
    </div>
  }
</div>
