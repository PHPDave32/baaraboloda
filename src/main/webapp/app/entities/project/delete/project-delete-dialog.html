@if (project) {
  <form name="deleteForm" (ngSubmit)="confirmDelete(project.id)">
    <div class="modal-header">
      <h4 class="modal-title" data-cy="projectDeleteDialogHeading" jhiTranslate="entity.delete.title">Confirmation de suppression</h4>
    </div>

    <div class="modal-body">
      <jhi-alert-error />
      <p id="jhi-delete-project-heading" jhiTranslate="baaraBolodaApp.project.delete.question" [translateValues]="{ id: project.id }">
        Êtes-vous certain de vouloir supprimer le Project {{ project.id }} ?
      </p>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="cancel()">
        <fa-icon icon="ban" />&nbsp;<span jhiTranslate="entity.action.cancel">Annuler</span>
      </button>

      <button id="jhi-confirm-delete-project" data-cy="entityConfirmDeleteButton" type="submit" class="btn btn-danger">
        <fa-icon icon="times" />&nbsp;<span jhiTranslate="entity.action.delete">Supprimer</span>
      </button>
    </div>
  </form>
}
